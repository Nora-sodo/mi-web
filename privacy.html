<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7650e9"><link rel="icon" href="./lifeplan-icon-64.png"><title>LifePlan</title><style>
:root{color-scheme:light;--purple:#7650e9;--ink:#27213b;--muted:#6d687a}
*{box-sizing:border-box}body{margin:0;background:#f7f6fc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);line-height:1.7}
main{max-width:800px;margin:35px auto 85px;background:white;border:1px solid #ece8f7;border-radius:24px;padding:clamp(24px,5vw,48px);box-shadow:0 14px 52px #4a31820a}
a{color:#6342cf}a:hover{text-decoration-thickness:2px}h1{font-size:clamp(28px,5vw,40px);line-height:1.2;margin:12px 0 18px}h2{font-size:20px;margin:30px 0 5px}p,li{font-size:15px}ul{padding-left:21px}.top{max-width:800px;margin:28px auto 0;padding:0 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:19px;font-weight:850;display:flex;align-items:center;gap:9px;text-decoration:none;color:#302345}.brand img{width:37px;height:37px;border-radius:12px}.back{font-weight:700;text-decoration:none}
.meta{font-size:13px;color:var(--muted)}.note{background:#f4efff;border:1px solid #e8dfff;border-radius:13px;padding:14px 16px}.note.warning{background:#fffaf0;border-color:#f1dfb4}.foot{display:flex;flex-wrap:wrap;gap:15px;border-top:1px solid #eee8f8;padding-top:18px;margin-top:35px;font-size:13px}.lang{font:inherit;border:1px solid #d5c9ea;border-radius:10px;padding:8px 9px;background:#fff;color:var(--ink)}
@media(max-width:580px){main{border-radius:0;margin:14px 0 40px;border-left:0;border-right:0}.top{margin-top:18px}}
</style></head><body><header class="top"><a class="brand" href="./"><img src="./lifeplan-icon-64.png" width="37" height="37" alt=""> LifePlan</a><select class="lang" id="lang" aria-label="Language"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option></select></header><main><h1 id="title"></h1><p class="meta" id="updated"></p><div id="sections"></div><nav class="foot" id="footer" aria-label="Related pages"></nav></main><script>
const CONTENT = {"page":"privacy","translations":{"en":["Privacy policy",[["Who operates LifePlan","LifePlan is an application for organizing tasks, projects, trips and collaborative activity. The identity and contact details of the data controller must be published before release. See the contact section below."],["Information processed","Depending on the features you use, LifePlan processes account information (email and sign-in identity), profile details, tasks and schedules, projects and trip plans, activity and XP, friendship requests, messages, posts and reports. Some information is stored on your device and synchronized with Supabase while signed in."],["Why this data is used","To provide account access, save and synchronize your progress, enable collaboration and social features, respond to reports, and secure the service. The appropriate legal bases and any optional processing must be confirmed by the operator before public release."],["Service providers","Account authentication and data storage use Supabase. Sign-in with Google is optional and provided through Google OAuth. The site is served via GitHub Pages. These providers may process technical data necessary to deliver their services."],["Sharing and visibility","Your private task data is intended for your account. Content you explicitly publish, profile information and leaderboard entries may be visible to other users depending on your choices and app settings. Do not publish sensitive personal information."],["Retention and deletion","Account-related records are intended to be removed when you delete your account, subject to technical dependencies and any legitimate retention obligations. Backup retention, logs and full deletion behavior must be verified before release. See the account-deletion page."],["Your choices and rights","You can update your profile, manage visibility, and request access, correction, export or deletion of your personal information where applicable. Contact details must be provided by the operator for rights requests."],["Contact","For privacy questions, access requests, corrections, exports or deletion requests, contact norasobrinodorca@gmail.com. The legal identity and address of the data controller must still be completed before public release."]]],"es":["Política de privacidad",[["Responsable","LifePlan permite organizar tareas, proyectos, viajes y actividad compartida. La identidad y los datos de contacto del responsable del tratamiento deben publicarse antes del lanzamiento. Consulta la sección de contacto."],["Datos tratados","Según las funciones utilizadas, LifePlan trata datos de cuenta (correo e identidad de acceso), perfil, tareas, agenda, proyectos, viajes, actividad y XP, solicitudes de amistad, mensajes, publicaciones y denuncias. Parte de los datos se guarda en el dispositivo y se sincroniza con Supabase al iniciar sesión."],["Finalidad","Permitir el acceso, guardar y sincronizar el progreso, ofrecer funciones sociales y de colaboración, gestionar denuncias y proteger el servicio. El responsable deberá confirmar las bases jurídicas y los tratamientos opcionales antes de publicar."],["Proveedores","LifePlan utiliza Supabase para autenticación y almacenamiento; el inicio de sesión con Google es opcional y funciona mediante OAuth. GitHub Pages aloja la web. Estos proveedores pueden tratar datos técnicos necesarios para prestar sus servicios."],["Visibilidad","Las tareas privadas están destinadas únicamente a su titular. El contenido publicado voluntariamente, los datos de perfil y el ranking pueden ser visibles para otros usuarios según la configuración. Evita publicar datos personales sensibles."],["Conservación y eliminación","Los registros vinculados a una cuenta están previstos para su eliminación al borrar la cuenta, sin perjuicio de las dependencias técnicas o de las obligaciones legítimas de conservación. Deben verificarse los plazos de las copias de seguridad, los registros técnicos y el borrado completo antes de publicar."],["Tus derechos","Puedes modificar tu perfil, gestionar la visibilidad y solicitar acceso, rectificación, exportación o supresión de tus datos cuando corresponda. El responsable debe facilitar un contacto válido para estas solicitudes."],["Contacto","Para consultas de privacidad y solicitudes de acceso, rectificación, exportación o eliminación de datos, escribe a norasobrinodorca@gmail.com. Antes del lanzamiento público hay que completar también la identidad legal y la dirección del responsable."]]],"fr":["Politique de confidentialité",[["Responsable","LifePlan permet d’organiser des tâches, projets, voyages et activités partagées. L’identité et les coordonnées du responsable du traitement doivent être ajoutées avant la publication."],["Données traitées","Selon les fonctionnalités utilisées : adresse e-mail et identité de connexion, profil, tâches, projets, voyages, activité et XP, demandes d’amis, messages, publications et signalements. Certaines données restent sur votre appareil et sont synchronisées avec Supabase."],["Finalités","Fournir le compte et la synchronisation, les fonctionnalités sociales, la gestion des signalements et la sécurité. Les bases légales doivent être confirmées avant la publication."],["Prestataires","Supabase assure l’authentification et le stockage ; la connexion Google utilise OAuth ; GitHub Pages héberge le site."],["Visibilité","Les tâches privées sont destinées à votre compte. Les publications, informations de profil et classements peuvent être visibles selon vos choix."],["Conservation et suppression","Les données liées au compte sont destinées à être supprimées lors de sa suppression, sous réserve des obligations légitimes et des limites techniques. La durée de conservation des sauvegardes doit être vérifiée."],["Vos droits","Vous pouvez demander l’accès, la rectification, l’exportation ou la suppression de vos données, selon les règles applicables."],["Contact","Pour toute question de confidentialité ou demande d’accès, de rectification, d’exportation ou de suppression, écrivez à norasobrinodorca@gmail.com. L’identité juridique et l’adresse du responsable doivent encore être précisées avant le lancement public."]]],"pt":["Política de privacidade",[["Responsável","A LifePlan permite organizar tarefas, projetos, viagens e atividades partilhadas. A identidade e os contactos do responsável pelo tratamento têm de ser indicados antes do lançamento."],["Dados tratados","Consoante as funcionalidades utilizadas: email e identidade de acesso, perfil, tarefas, projetos, viagens, atividade e XP, pedidos de amizade, mensagens, publicações e denúncias. Alguns dados ficam no dispositivo e são sincronizados com o Supabase."],["Finalidades","Permitir acesso, sincronização, funcionalidades sociais, gestão de denúncias e segurança. As bases legais têm de ser confirmadas antes do lançamento."],["Prestadores","A autenticação e o armazenamento usam Supabase; o acesso Google usa OAuth; o site está alojado no GitHub Pages."],["Visibilidade","As tarefas privadas destinam-se à própria conta. Publicações, dados de perfil e rankings podem ser visíveis consoante as opções do utilizador."],["Conservação e eliminação","Os dados associados à conta destinam-se a ser eliminados quando a conta é apagada, sem prejuízo de obrigações legítimas ou limites técnicos. É necessário verificar a retenção de cópias de segurança."],["Direitos","Podes solicitar acesso, correção, exportação ou eliminação dos teus dados, quando aplicável."],["Contacto","Para questões de privacidade ou pedidos de acesso, correção, exportação ou eliminação de dados, escreve para norasobrinodorca@gmail.com. A identidade legal e a morada do responsável ainda têm de ser indicadas antes do lançamento público."]]]},"links":[["privacy","Privacy","Privacidad","Confidentialité","Privacidade"],["terms","Terms","Condiciones","Conditions","Condições"],["delete-account","Delete account","Eliminar cuenta","Supprimer le compte","Eliminar conta"],["support","Support","Soporte","Assistance","Suporte"]]};
function show(lang){
 const v=CONTENT.translations[lang]||CONTENT.translations.en;
 document.documentElement.lang=lang;document.title=v[0]+' — LifePlan';
 document.getElementById('title').textContent=v[0];
 document.getElementById('updated').textContent=({en:'Updated 11 November 2026 · Draft: verify before public launch',es:'Actualizado el 11 de noviembre de 2026 · Borrador: revisar antes del lanzamiento',fr:'Mis à jour le 11 novembre 2026 · Projet à valider avant le lancement',pt:'Atualizado a 11 de novembro de 2026 · Rascunho a validar antes do lançamento'})[lang];
 const sections=document.getElementById('sections');sections.replaceChildren();
 v[1].forEach(([heading,body])=>{const h=document.createElement('h2');h.textContent=heading;const p=document.createElement('p');p.textContent=body;sections.append(h,p)});
 const footer=document.getElementById('footer');footer.replaceChildren();
 CONTENT.links.forEach(item=>{const a=document.createElement('a');a.href='./'+item[0]+'.html';a.textContent=item[['en','es','fr','pt'].indexOf(lang)+1];footer.append(a)});
 const a=document.createElement('a');a.href='./';a.textContent=({en:'Back to LifePlan',es:'Volver a LifePlan',fr:'Retour à LifePlan',pt:'Voltar à LifePlan'})[lang];footer.prepend(a);
 const contact=document.createElement('a');
 const subjects={en:"LifePlan \u2014 Support and privacy",es:"LifePlan \u2014 Soporte y privacidad",fr:"LifePlan \u2014 Assistance et confidentialit\u00e9",pt:"LifePlan \u2014 Apoio e privacidade"};
 contact.href='mailto:norasobrinodorca@gmail.com?subject='+encodeURIComponent(subjects[lang]);
 contact.textContent=({"en": "Contact LifePlan", "es": "Contactar con LifePlan", "fr": "Contacter LifePlan", "pt": "Contactar a LifePlan"} )[lang];
 footer.append(contact);

}
let lang='en';try{lang=localStorage.getItem('lifeplan-ui-language')||'en'}catch(_){}
if(!['en','es','fr','pt'].includes(lang))lang='en';
document.getElementById('lang').value=lang;show(lang);
document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;try{localStorage.setItem('lifeplan-ui-language',lang)}catch(_){}show(lang)});
</script></body></html>
