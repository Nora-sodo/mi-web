.v5WeekScroll{overflow-x:auto;border:1px solid var(--line);border-radius:20px;background:#fff;margin:20px 0;box-shadow:var(--shadow)}.v5WeekGrid{display:grid;grid-template-columns:64px repeat(7,minmax(123px,1fr));min-width:940px}.v5WeekHead{position:sticky;top:0;z-index:1;background:#faf9ff;padding:13px 8px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-size:12px;font-weight:850;text-transform:capitalize}.v5WeekHead.v5Current{background:#ebe3ff;color:#6343bc}.v5WeekHead small{display:block;color:#9d691c;font-size:10px;margin-top:5px}.v5WeekHour{padding:11px 8px;text-align:right;font-size:11px;font-weight:800;color:var(--muted);border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:#fbfbff}.v5WeekCell{min-height:61px;padding:5px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);cursor:pointer}.v5WeekCell:hover{background:#f7f3ff}.v5TimeBlock{display:block;text-align:left;padding:6px 7px;width:100%;border-radius:8px;background:#f0eaff;color:#6044b1;font-size:11px;line-height:1.4;white-space:normal;margin:1px 0 3px;overflow-wrap:anywhere}.v5TimeBlock.v5Done{background:#e2f8ee;color:#238763}.v5NoTime{padding:10px 0;border-bottom:1px solid var(--line)}.v5NoTime:last-child{border-bottom:0}.v5NoTime>b{display:block;margin:8px 0;font-size:13px;text-transform:capitalize}
.v5NoteGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px;margin-top:15px}.v5Note{min-height:180px;display:flex;flex-direction:column;gap:13px}.v5Note h3{margin:0;font-size:17px}.v5Note p{flex:1;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.55;color:#717d98;font-size:13px;margin:0}.v5Note .row{font-size:11px}.v5Booking{display:flex;gap:12px;align-items:flex-start;border-bottom:1px solid var(--line);padding:14px 0}.v5Booking:last-child{border-bottom:0}.v5Booking>div:last-child{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.v5Booking b{font-size:13px}.v5Booking .mini{margin-top:5px;line-height:1.6}.v5Booking .link{font-size:11px;padding:5px}
@media(max-width:1150px){.v5Dash{grid-template-columns:1fr}.v5hero{padding:22px}.v5DayCard{min-width:65px}}
@media(max-width:650px){.v5hero{border-radius:19px;padding:20px}.v5Orb{height:66px;width:66px;font-size:32px;border-radius:20px}.v5Dash{gap:8px}.v5Quick{padding:13px}.v5Quick .row{flex-direction:row}.v5WeekScroll{margin:15px -8px}.v5NoteGrid{grid-template-columns:1fr}.v5Booking{flex-wrap:wrap}.v5Booking>div:last-child{width:100%;justify-content:flex-start}.v5DayCard{min-width:66px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}


/* Evitar que las tarjetas con texto largo ensanchen la vista móvil. */
.v5Dash>div,.v5Dash .card,.v5TaskRow .grow,.v5Note,.v5Booking .grow{min-width:0}.v5TaskRow .taskname,.v5TaskRow .mini,.v5Note h3,.v5Booking .grow{overflow-wrap:anywhere}@media(max-width:650px){.v5TaskRow{gap:8px}.v5Small{padding:7px!important;font-size:10px!important}.v5WeekStrip{max-width:100%}}

function taskRow(t,date=TODAY()){return `<div class="todayTask"><button class="tick ${isDone(t,date)?'done':''}" onclick="toggleTask('${safe(t.id)}','${date}')">${isDone(t,date)?'✓':''}</button><div class="grow"><div class="taskname ${isDone(t,date)?'done':''}">${safe(t.title)}</div><div class="mini" style="margin-top:5px">${safe(t.time||'Sin hora')} · ${t.repeat!=='ninguna'?'🔁 '+safe(t.repeat):'una vez'}</div></div><button class="link" onclick="editTask('${safe(t.id)}')">Editar</button></div>`}
function home(){let tasks=dayTasks();return header('¡A por otro gran día! 👋',`Hoy es ${stamp()}. Cada pequeño paso cuenta.`)+`<div class="banner">✨ <b>Modo demostración social.</b> Los perfiles y publicaciones de ejemplo son ficticios. Para compartir de verdad con otras personas, conecta tu propio servidor en <a href="#" onclick="go('perfil');return false">Mi perfil</a>.</div><section class="hero"><div><div class="eyebrow" style="color:#e5d9ff">TU AVENTURA CONTINÚA</div><h2>¡Vas por el nivel ${xpLevel()}!</h2><p>Haz tus misiones, gana XP y descubre a personas que disfrutan de lo mismo que tú.</p><div class="progress"><span style="width:${xpPct()}%"></span></div><div style="font-size:11px;margin-top:8px">${state.xp%180}/180 XP para el siguiente nivel</div></div><div class="medal">🏆</div></section><div class="sectionhead"><h2>Misiones de hoy 🎯</h2><button class="link" onclick="go('misiones')">Ver todas →</button></div><div class="two"><div class="card">${tasks.length?tasks.map(t=>taskRow(t)).join(''):'<div class="empty">¡Día despejado! Añade una misión ✨</div>'}<button class="secondary full" style="margin-top:15px" onclick="openCreate('tarea')">＋ Nueva misión</button></div><div class="card"><div class="row"><span style="font-size:32px">🔥</span><div><div class="streakNum">${streak()} <span style="font-size:14px;letter-spacing:0;color:var(--muted)">días</span></div><div class="mini">Tu racha personal</div></div></div><div class="week">${Array.from({length:7},(_,i)=>{const date=addDays(TODAY(),i-6),yes=state.doneDates.includes(date);return `<div class="day"><span>${['D','L','M','X','J','V','S'][new Date(date+'T12:00:00').getDay()]}</span><div class="dot ${yes?'done':''} ${i===6?'now':''}">${yes?'✓':date.slice(8)}</div></div>`}).join('')}</div><p class="sub">Completa al menos una tarea cada día para mantenerla.</p></div></div><div class="sectionhead"><h2>Tu próxima aventura 🌍</h2><button class="link" onclick="go('explorar')">Descubrir →</button></div><div class="itemGrid">${(state.plans.slice(0,2).length?state.plans.slice(0,2):samplePosts.slice(0,2)).map(p=>postCard(p)).join('')}</div>`}
function postCard(p){const remote=!!p.remote;const owner=p.owner||state.name;const liked=state.likes.includes(p.id);return `<article class="card exploreCard"><div class="cover ${p.type==='proyecto'?'green':p.type==='viaje'?'blue':'yellow'}">${safe(p.emoji|| (p.type==='viaje'?'✈️':'🚀'))}</div><div class="exploreBody"><div class="row" style="justify-content:space-between"><span class="tag ${p.type==='viaje'?'green':''}">${p.type==='viaje'?'✈️ Viaje':'🚀 Proyecto'}</span><span class="postmeta">${p.demo?'EJEMPLO':'🌐 Público'}</span></div><h3>${safe(p.title)}</h3><p>${safe(p.description||'Sin descripción')}</p><div class="chiprow">${(p.tags||[]).slice(0,3).map(t=>`<span class="tag">#${safe(t)}</span>`).join('')}</div><div class="row" style="margin-top:14px;border-top:1px solid var(--line);padding-top:13px"><div class="avatar sm">${safe(p.avatar||'🧑‍🚀')}</div><div class="grow" style="font-size:12px;font-weight:800">${safe(owner)}</div>${p.demo?`<button class="outline tinyBtn" onclick="demoOnly()">♡ ${p.likes||0}</button>`:`<button class="outline tinyBtn" onclick="likePost('${safe(p.id)}')">${liked?'♥':'♡'} ${p.likes||0}</button>`}</div></div></article>`}
function explore(){const posts=[...remotePosts,...state.posts,...samplePosts],shown=posts.filter(p=>(filter==='todos'||p.type===filter)&&[p.title,p.description,(p.tags||[]).join(' '),p.owner].join(' ').toLowerCase().includes(search.toLowerCase()));return header('Descubre tu gente 🌍','Viajes, proyectos e ideas para compartir sin complicaciones.')+`<div class="row" style="justify-content:space-between;align-items:stretch;gap:10px"><input class="search" style="flex:1" placeholder="🔎  Busca rutas, aficiones, proyectos..." value="${safe(search)}" oninput="search=this.value;const q=this.selectionStart;renderMain();const n=document.querySelector('.search');if(n){n.focus();n.setSelectionRange(q,q)}"><button class="primary" onclick="openCreate('viaje')">＋ Publicar</button></div><div class="filterbar">${[['todos','✨ Todo'],['viaje','✈️ Viajes'],['proyecto','🚀 Proyectos']].map(([k,l])=>`<button class="${filter===k?'active':''}" onclick="filter='${k}';renderMain()">${l}</button>`).join('')}</div><div class="itemGrid">${shown.length?shown.map(postCard).join(''):'<div class="empty">No hay publicaciones con esa búsqueda.</div>'}</div><div class="sectionhead"><h2>Personas con intereses parecidos 🤝</h2></div><div class="people">${peopleHtml()}</div>`}
function calculateMatch(tags){const a=state.interests.map(x=>x.toLowerCase()),b=tags.map(x=>x.toLowerCase());const n=b.filter(x=>a.includes(x)).length;return Math.min(98,55+n*14)}function peopleHtml(){let people=[...remotePeople.filter(p=>p.id!==user?.id).map(p=>({name:p.display_name,avatar:p.avatar||'🙂',bio:(p.interests||[]).join(' · '),tags:p.interests||[],score:calculateMatch(p.interests||[]),remote:true})),...samplePeople];return people.sort((a,b)=>b.score-a.score).slice(0,6).map(p=>`<div class="person"><div class="avatar">${safe(p.avatar)}</div><div class="grow"><h4>${safe(p.name)} <span class="postmeta">${p.remote?'🌐':'· ejemplo'}</span></h4><p>${safe(p.bio)}</p></div><div style="text-align:right"><div class="match">${p.score}% afinidad*</div><button class="link" onclick="${p.remote?`showPerson('${safe(p.name)}')`:'demoOnly()'}">Ver perfil</button></div></div>`).join('')+`<div class="mini">* Afinidad orientativa basada en etiquetas compartidas, no un algoritmo de compatibilidad personal.</div>`}
function agenda(){let date=calendarDate,year=+date.slice(0,4),month=+date.slice(5,7),first=new Date(year,month-1,1).getDay(),offset=(first+6)%7,nDays=new Date(year,month,0).getDate();let monthName=new Date(year,month-1,1).toLocaleDateString('es-ES',{month:'long',year:'numeric'});const dts=dayTasks(date);return header('Tu agenda 📅','Organiza tu horario y señala días especiales.')+`<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:17px"><button class="outline tinyBtn" onclick="changeMonth(-1)">❮</button><h2 style="text-transform:capitalize;margin:0;font-size:18px">${monthName}</h2><button class="outline tinyBtn" onclick="changeMonth(1)">❯</button></div><div class="specialGrid">${['L','M','X','J','V','S','D'].map(d=>`<div style="text-align:center;font-size:11px;font-weight:800;color:var(--muted)">${d}</div>`).join('')}${Array(offset).fill('<div></div>').join('')}${Array.from({length:nDays},(_,i)=>{let day=String(i+1).padStart(2,'0'),d=`${year}-${String(month).padStart(2,'0')}-${day}`,special=state.specials[d];return `<button class="calday ${d===date?'active':''} ${special?'special':''}" onclick="calendarDate='${d}';renderMain()">${i+1}<small>${special?'⭐':dayTasks(d).length?'• '+dayTasks(d).length+' tareas':''}</small></button>`}).join('')}</div><div class="row" style="margin-top:17px;flex-wrap:wrap"><span class="mini">🟨 Día especial</span><span class="mini">🟣 Día seleccionado</span><button class="secondary" style="margin-left:auto" onclick="openSpecial()">＋ Marcar día</button></div></div><div class="sectionhead"><h2>${new Date(date+'T12:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'long'})} · Horario</h2><button class="link" onclick="openCreate('tarea')">＋ Actividad</button></div>${state.specials[date]?`<div class="banner">⭐ <b>${safe(state.specials[date].type)}</b>: ${safe(state.specials[date].note||'Día especial')} <button class="link" onclick="deleteSpecial('${date}')">Eliminar</button></div>`:''}<div class="timeline">${dts.length?dts.map(t=>`<div class="timeItem"><b>${safe(t.time||'—')}</b><div class="grow"><span>${safe(t.title)}</span><div class="mini">${safe(t.repeat)}</div></div><button class="tick ${isDone(t,date)?'done':''}" onclick="toggleTask('${safe(t.id)}','${date}')">${isDone(t,date)?'✓':''}</button></div>`).join(''):'<div class="empty">Sin actividades para este día.</div>'}</div>`}
function missions(){const plans=state.plans;return header('Tus misiones 🎯','Tareas recurrentes, proyectos y viajes en un mismo lugar.')+`<div class="row" style="margin:25px 0 12px;justify-content:space-between"><h2 style="margin:0;font-size:18px">📌 Tareas</h2><button class="secondary" onclick="openCreate('tarea')">＋ Añadir</button></div><div class="card">${state.tasks.length?state.tasks.map(t=>`<div class="todayTask"><div class="grow"><div class="taskname">${safe(t.title)}</div><div class="mini">${safe(t.date)} · ${safe(t.time)} · ${safe(t.repeat)}</div></div><button class="link" onclick="editTask('${safe(t.id)}')">Editar</button><button class="link" style="color:var(--red)" onclick="deleteTask('${safe(t.id)}')">✕</button></div>`).join(''):'<div class="empty">Todavía no hay tareas.</div>'}</div><div class="sectionhead"><h2>🗺️ Mis viajes y proyectos</h2><button class="secondary" onclick="openCreate('proyecto')">＋ Planificar</button></div><div class="itemGrid">${plans.length?plans.map(p=>`<div class="card"><div class="row" style="justify-content:space-between"><span class="tag">${p.type==='viaje'?'✈️ Viaje':'🚀 Proyecto'}</span><span class="status">${p.public?'🌐 Público':'🔒 Privado'}</span></div><h3>${safe(p.emoji)} ${safe(p.title)}</h3><p class="sub">${safe(p.description||'Sin descripción')}</p><div class="mini">📅 ${safe(p.date||'Sin fecha')} · #${(p.tags||[]).map(safe).join(' #')}</div><div class="row" style="margin-top:18px;flex-wrap:wrap"><button class="secondary tinyBtn" onclick="editPlan('${safe(p.id)}')">Editar</button><button class="outline tinyBtn" onclick="sharePlan('${safe(p.id)}')">${p.public?'🔒 Hacer privado':'🌍 Publicar'}</button><button class="link" style="color:var(--red);margin-left:auto" onclick="deletePlan('${safe(p.id)}')">Eliminar</button></div></div>`).join(''):'<div class="empty">Crea tu primer viaje o proyecto. Por defecto será privado.</div>'}</div>`}
function team(){return header('Juntos es mejor 🔥','Una racha compartida convierte cada día en un reto en equipo.')+`<div class="hero" style="min-height:164px"><div><div class="eyebrow" style="color:#e5d9ff">MI EQUIPO</div><h2>🔥 ${safe(state.teamName)}</h2><p>La racha del grupo sube cuando al menos dos miembros registran una misión completada el mismo día.</p></div><div class="medal">🤝</div></div><div class="sectionhead"><h2>Racha compartida</h2><button class="link" onclick="openTeam()">Gestionar →</button></div><div class="two"><div class="card"><div class="row"><div style="font-size:52px">🔥</div><div><div class="streakNum">${teamStreak()}</div><div class="mini">días seguidos en equipo ${client&&user?'(online)':'(demo)'}</div></div></div><p class="sub">Tú y tu grupo tenéis una pequeña meta en común. ¡No hace falta competir!</p><button class="primary full" onclick="checkIn()">✓ He avanzado hoy</button></div><div class="card"><h3 style="margin-top:0">👥 Mi grupo</h3>${state.teamMembers.map((n,i)=>`<div class="leader"><div class="avatar sm">${['🧑‍🚀','👩🏻','🧑🏽','👩🏾'][i%4]}</div><div class="grow" style="font-weight:800;font-size:12px">${safe(n)}</div><span class="tag green">${i===0?'Tú':'Miembro'}</span></div>`).join('')}<button class="secondary full" onclick="openTeam()">Crear o unirme a grupo</button></div></div><div class="sectionhead"><h2>Conoce personas afines ✨</h2><button class="link" onclick="go('explorar')">Explorar más →</button></div><div class="people">${peopleHtml()}</div><div class="banner" style="margin-top:18px">🔒 Las rachas y perfiles compartidos requieren consentimiento. Los viajes y proyectos son privados por defecto; nunca publicamos tus tareas personales ni tu ubicación en tiempo real.</div>`}
function teamStreak(){if(!user||!client||!remoteMembers.length)return user&&client?0:state.teamMockDays;const grouped={};for(const c of remoteChecks){(grouped[c.day]??=new Set()).add(c.user_id)}let n=0,d=TODAY();if((grouped[d]?.size||0)<2)d=addDays(d,-1);while((grouped[d]?.size||0)>=2){n++;d=addDays(d,-1)}return n}
function profile(){return header('Tu perfil 👤','Elige qué compartir. Tu vida privada sigue siendo tuya.')+`<div class="card"><div class="row"><div class="avatar" style="width:70px;height:70px;font-size:37px">${safe(state.avatar)}</div><div class="grow"><h2 style="margin:0">${safe(state.name)}</h2><div class="sub">Nivel ${xpLevel()} · Aventurero/a espacial</div><div class="xpbar"><span style="width:${xpPct()}%"></span></div></div><button class="outline" onclick="editProfile()">Editar</button></div><div class="statGrid" style="margin-top:26px"><div class="stat"><b>${state.xp}</b><span>XP</span></div><div class="stat"><b>${streak()}</b><span>Racha</span></div><div class="stat"><b>${state.plans.length}</b><span>Planes</span></div></div></div><div class="sectionhead"><h2>🏅 Tus insignias</h2></div><div class="card"><div class="row" style="flex-wrap:wrap;gap:15px">${[['🥇','Primera misión',state.earned.length>0],['🔥','Tres días',streak()>=3],['🚀','Primer proyecto',state.plans.some(p=>p.type==='proyecto')],['🌍','Primer viaje',state.plans.some(p=>p.type==='viaje')],['💯','500 XP',state.xp>=500]].map(([a,b,c])=>`<div style="text-align:center;flex:1;min-width:77px;opacity:${c?1:.3}"><div style="font-size:36px">${a}</div><div class="mini" style="font-weight:800">${b}</div></div>`).join('')}</div></div><div class="sectionhead"><h2>🌐 Conexión social</h2></div><div class="card"><div class="row" style="justify-content:space-between"><div><b>${user?'Conectado':'Modo local / demo'}</b><p class="sub" style="margin:5px 0">${user?'Tus publicaciones públicas pueden aparecer en Explorar.':'Para conectar con otras personas necesitas activar un backend.'}</p></div><span class="tag ${user?'green':'orange'}">${user?'ONLINE':'DEMO'}</span></div><div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="primary" onclick="openConnect()">${user?'Configurar conexión':'Activar online'}</button>${user?'<button class="outline" onclick="logout()">Cerrar sesión</button>':''}</div></div><div class="sectionhead"><h2>⚙️ Tus datos</h2></div><div class="card"><p class="sub">Tus tareas y agenda se guardan en este navegador. Exporta una copia antes de cambiar de dispositivo.</p><div class="row" style="flex-wrap:wrap"><button class="secondary" onclick="exportData()">⬇ Exportar datos</button><button class="outline" onclick="importData()">⬆ Importar datos</button></div></div>`}
function right(){document.getElementById('right').innerHTML=`<div class="profileBar"><div class="avatar">${safe(state.avatar)}</div><div class="grow"><b style="font-size:13px">${safe(state.name)}</b><div class="mini">Nivel ${xpLevel()} · ${state.xp} XP</div><div class="xpbar"><span style="width:${xpPct()}%"></span></div></div></div><h3>🔥 Tu progreso</h3><div class="rightbox"><div class="row"><span style="font-size:32px">⚡</span><div><b>${state.xp} XP</b><div class="mini">¡Cada misión suma!</div></div></div><div class="row" style="margin-top:16px"><span style="font-size:30px">🏅</span><div><b>${streak()} días</b><div class="mini">Racha personal</div></div></div></div><h3 style="margin-top:25px">✨ Comunidad</h3><div class="rightbox"><div class="leader"><div class="avatar sm">👩🏻</div><div class="grow"><b style="font-size:12px">Lucía</b><div class="mini">Viajes y naturaleza</div></div><span class="tag">demo</span></div><div class="leader"><div class="avatar sm">🧑🏽</div><div class="grow"><b style="font-size:12px">Marcos</b><div class="mini">Idiomas y hábitos</div></div><span class="tag">demo</span></div><button class="secondary full" onclick="go('explorar')">Descubrir personas</button></div><div class="rightbox" style="background:#f3efff;border:0"><div style="font-size:27px">🌱</div><h3 style="margin:9px 0">Pequeños pasos</h3><div class="sub">La constancia gana a la perfección. Avanza a tu ritmo.</div></div>`}
function renderMain(){const p=document.getElementById('page');p.innerHTML=({inicio:home,explorar:explore,agenda,misiones:missions,equipo:team,perfil:profile}[tab])();document.getElementById('floating').style.display=tab==='perfil'?'none':'block'}function render(){renderNav();renderMain();right();save()}
function toggleTask(taskId,day){const t=state.tasks.find(x=>x.id===taskId);if(!t)return;t.done||=[];let ix=t.done.indexOf(day);if(ix>=0)t.done.splice(ix,1);else{t.done.push(day);if(!state.earned.includes(taskId+':'+day)){state.earned.push(taskId+':'+day);state.xp+=15;toast('¡+15 XP! Misión completada ⚡')}}if(t.done.includes(day)&&!state.doneDates.includes(day))state.doneDates.push(day);if(!state.tasks.some(x=>isDone(x,day)))state.doneDates=state.doneDates.filter(x=>x!==day);render()}
function changeMonth(n){const d=new Date(calendarDate+'T12:00:00');d.setDate(1);d.setMonth(d.getMonth()+n);calendarDate=d.toISOString().slice(0,10);renderMain()}
function modal(content){document.getElementById('modalRoot').innerHTML=`<div class="modalback" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`};function closeModal(){document.getElementById('modalRoot').innerHTML=''};
function openCreate(kind){const k=kind||'tarea';if(k==='tarea')return editTask();editPlan(null,k)}
function editTask(taskId){const t=state.tasks.find(x=>x.id===taskId)||{title:'',date:calendarDate,time:'',repeat:'ninguna',tags:[]};modal(`<h2>${taskId?'Editar misión':'✨ Nueva misión'}</h2><p class="sub">Una tarea pequeña puede ser el inicio de algo grande.</p><form onsubmit="saveTask(event,'${taskId||''}')"><label>¿Qué quieres hacer?</label><input name="title" maxlength="100" required value="${safe(t.title)}" placeholder="Ej. Estudiar 20 minutos"><div class="row"><div class="grow"><label>Fecha de inicio</label><input type="date" name="date" required value="${safe(t.date)}"></div><div class="grow"><label>Hora</label><input type="time" name="time" value="${safe(t.time||'')}"></div></div><label>Repetición</label><select name="repeat">${[['ninguna','No repetir'],['diaria','Cada día'],['laborables','De lunes a viernes'],['semanal','Cada semana'],['mensual','Cada mes'],['anual','Cada año']].map(([v,l])=>`<option value="${v}" ${t.repeat===v?'selected':''}>${l}</option>`).join('')}</select><div class="modalActions"><button type="button" class="outline" onclick="closeModal()">Cancelar</button><button class="primary">Guardar misión</button></div></form>`)}
function saveTask(e,taskId){e.preventDefault();const f=new FormData(e.target),obj={title:String(f.get('title')).trim(),date:String(f.get('date')),time:String(f.get('time')),repeat:String(f.get('repeat'))};if(!obj.title)return;let t=state.tasks.find(x=>x.id===taskId);if(t)Object.assign(t,obj);else state.tasks.push({id:id(),...obj,done:[],tags:[]});closeModal();render();toast('Misión guardada ✓')}

async function connectFromForm(e){e.preventDefault();let f=new FormData(e.target);state.config.url=String(f.get('url')).trim();state.config.key=String(f.get('key')).trim();save();try{await initClient();toast('Proyecto conectado. Inicia sesión por correo.');openConnect()}catch(err){toast('Conexión fallida: '+err.message)}}
async function initClient(){if(!state.config.url||!state.config.key)return;if(!/^https:\/\/[a-z0-9.-]+\.supabase\.co\/?$/i.test(state.config.url))throw Error('Introduce una URL válida de Supabase');if(!window.supabase){await new Promise((resolve,reject)=>{let s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js';s.onload=resolve;s.onerror=()=>reject(Error('No se pudo cargar la biblioteca'));document.head.appendChild(s)})}client=window.supabase.createClient(state.config.url,state.config.key);let res=await client.auth.getUser();user=res.data.user||null;client.auth.onAuthStateChange((_event,session)=>{user=session?.user||null;setTimeout(()=>{if(user){pushProfile().then(loadRemote).catch(()=>{})}else{remotePosts=[];remotePeople=[];remoteChecks=[];render()}},0)});if(user){await pushProfile();await loadRemote()}render()}

async function pushPost(p){if(!user||!client)return;const payload={user_id:user.id,local_id:String(p.id),type:p.type,title:p.title,description:p.description,tags:p.tags,emoji:p.emoji,is_public:p.public,start_date:p.date||null};const {error}=await client.from('posts').upsert(payload,{onConflict:'user_id,local_id'});if(error)throw error;await loadRemote()}
async function loadRemote(){if(!user||!client)return;const [a,b,c]=await Promise.all([client.from('posts').select('id,user_id,title,description,type,emoji,tags,start_date,profiles(display_name,avatar)').eq('is_public',true).order('created_at',{ascending:false}).limit(80),client.from('profiles').select('id,display_name,avatar,interests').limit(80),client.from('checkins').select('user_id,day').gte('day',addDays(TODAY(),-60)).limit(1000)]);if(a.error)throw a.error;if(b.error)throw b.error;remotePosts=(a.data||[]).filter(p=>p.user_id!==user.id).map(p=>({...p,owner:p.profiles?.display_name||'Explorador',avatar:p.profiles?.avatar||'🙂',remote:true,likes:0}));remotePeople=b.data||[];remoteChecks=c.data||[];await loadCircle();render()}
async function loadCircle(){if(!client||!user)return;const {data:memberships}=await client.from('circle_members').select('circle_id').eq('user_id',user.id).limit(1);if(!memberships?.length){remoteMembers=[];remoteChecks=[];return}const circleId=memberships[0].circle_id;const [c,m]=await Promise.all([client.from('circles').select('id,name').eq('id',circleId).single(),client.from('circle_members').select('user_id,profiles(display_name)').eq('circle_id',circleId)]);if(c.data)state.teamName=c.data.name;remoteMembers=(m.data||[]).map(x=>x.user_id);state.teamMembers=(m.data||[]).map(x=>x.user_id===user.id?state.name:(x.profiles?.display_name||'Miembro'));remoteChecks=remoteChecks.filter(x=>remoteMembers.includes(x.user_id));}

function adventureCard(a){
 const steps=Array.isArray(a.steps)?a.steps:[];
 const completed=(a.remote? a.myCompleted||[] : a.completed||[]);
 const count=steps.filter((_,i)=>completed.includes(i)).length;
 const percentage=steps.length?Math.round(100*count/steps.length):0;
 const members= a.remote ? a.memberCount||1 : 1;
 const groupDone=a.remote&&a.memberCompleted?.length? a.memberCompleted.reduce((sum,c)=>sum+c,0):count;
 const groupTotal=steps.length*members;
 return `<article class="card adventureCard"><div class="row" style="justify-content:space-between"><span class="adventureEmoji">${safe(a.emoji||'🗺️')}</span><span class="tag ${a.remote?'green':''}">${a.remote?'🌐 Compartida':'🔒 Personal'}</span></div><h3>${safe(a.title)}</h3><p class="sub">${safe(a.description||'Un objetivo que merece la pena.')}</p><div class="mini" style="font-weight:800;margin-bottom:7px">Tu progreso · ${count}/${steps.length} etapas</div><div class="xpbar"><span style="width:${percentage}%"></span></div><div class="row" style="justify-content:space-between;margin-top:12px;gap:7px"><span class="mini">${a.remote?'👥 '+members+' participantes · '+groupDone+'/'+groupTotal+' etapas conjuntas':'⭐ +10 XP por etapa'}</span><span class="tag green">${percentage}%</span></div><button class="secondary full" style="margin-top:17px" onclick="openAdventure('${safe(a.id)}',${a.remote?'true':'false'})">Ver etapas →</button></article>`;
}

async function saveAdventure(e){e.preventDefault();const f=new FormData(e.target);
 const title=String(f.get('title')||'').trim(),description=String(f.get('description')||'').trim();
 const steps=String(f.get('steps')||'').split('\n').map(x=>x.trim()).filter(Boolean);
 if(!title||steps.length<2||steps.length>12){toast('Indica entre 2 y 12 etapas');return}
 const type=String(f.get('type')),mode=String(f.get('mode'));
 const item={id:id(),title,description,steps,type,emoji:type==='viaje'?'✈️':'🚀',completed:[],createdAt:TODAY()};
 if(mode==='online'){
  if(!user||!client){toast('Conecta una cuenta para compartir');return}
  const code=makeCode();
  const {data,error}=await client.from('adventures').insert({title,description,steps,type,emoji:item.emoji,code,created_by:user.id}).select().single();
  if(error){toast('No se pudo crear: '+error.message);return}
  const {error:memberError}=await client.from('adventure_members').insert({adventure_id:data.id,user_id:user.id,completed:[]});
  if(memberError){toast('Aventura creada, pero hubo un error al asociarte: '+memberError.message);return}
  closeModal();await loadAdventures();render();
  modal(`<h2>🎉 Aventura creada</h2><p class="sub">Comparte este código <b>solo con quien quieras invitar</b>.</p><div class="inviteCode">${safe(code)}</div><div class="modalActions"><button class="secondary" onclick="navigator.clipboard?.writeText('${safe(code)}').then(()=>toast('Código copiado')).catch(()=>toast('Selecciona y copia el código'))">Copiar código</button><button class="primary" onclick="closeModal()">Continuar</button></div>`);
 }else{state.adventures.unshift(item);state.xp+=20;save();closeModal();render();toast('¡Aventura creada! +20 XP 🎉')}
}
function makeCode(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const v=new Uint8Array(8);crypto.getRandomValues(v);return [...v].map(x=>alphabet[x%alphabet.length]).join('')}
function lookupAdventure(aid,remote){return remote?onlineAdventures.find(a=>a.id===aid):state.adventures.find(a=>a.id===aid)}
function openAdventure(aid,remote=false){const a=lookupAdventure(aid,remote);if(!a)return toast('Aventura no encontrada');const steps=a.steps||[];const done=remote?a.myCompleted||[]:a.completed||[];
 const stepHtml=steps.map((s,i)=>`<button class="coopStep ${done.includes(i)?'completed':''}" onclick="completeAdventureStep('${safe(a.id)}',${i},${remote?'true':'false'})"><span class="stepIcon">${done.includes(i)?'✓':i+1}</span><span>${safe(s)}</span><span style="margin-left:auto;color:var(--muted);font-size:12px">${done.includes(i)?'Hecho':'10 XP'}</span></button>`).join('');
 modal(`<div class="row"><span style="font-size:39px">${safe(a.emoji)}</span><div><h2 style="margin:0">${safe(a.title)}</h2><div class="sub">${remote?'Aventura compartida':'Aventura privada'}</div></div></div><p class="sub">${safe(a.description||'Cada etapa te acerca a tu objetivo.')}</p><h3>Tu ruta de misiones</h3><div class="coopSteps">${stepHtml}</div>${remote?`<div class="notice">👥 ${a.memberCount||1} miembros · Cada uno registra su propio avance. El progreso conjunto suma las etapas de todos los miembros.</div>${a.created_by===user?.id?`<p class="sub">Código de acceso: <b>${safe(a.code)}</b></p>`:''}`:''}<div class="modalActions">${!remote?`<button class="outline" onclick="removeAdventure('${safe(a.id)}')">Eliminar</button>`:''}<button class="primary" onclick="closeModal()">Cerrar</button></div>`)

async function completeAdventureStep(aid,idx,remote=false){const a=lookupAdventure(aid,remote);if(!a)return;
 const current=remote?[...(a.myCompleted||[])]:[...(a.completed||[])];const pos=current.indexOf(idx);
 if(pos>=0)current.splice(pos,1);else current.push(idx);
 if(remote){
 const {error}=await client.from('adventure_members').update({completed:current}).eq('adventure_id',aid).eq('user_id',user.id);
 if(error){toast('No se pudo guardar: '+error.message);return}await loadAdventures();
 }else{a.completed=current;save()}
 const earned='adventure:'+aid+':'+idx;
 if(pos<0&&!state.earned.includes(earned)){state.earned.push(earned);state.xp+=10;save();toast('¡Etapa completada! +10 XP ⚡')}
 render();openAdventure(aid,remote);
}

 if(ad.error||peers.error){toast((ad.error||peers.error).message);return}

function editStop(pid,sid=''){let s=tripData(pid).stops.find(x=>x.id===sid)||{name:'',kind:'Ciudad',day:'',time:'',address:'',note:'',lat:null,lng:null};modal(`<h2>📍 ${sid?'Editar':'Nueva'} parada o actividad</h2><p class="sub">Añade una ciudad, restaurante, museo o cualquier lugar. Busca su ubicación para marcarlo en el mapa.</p><form onsubmit="saveStop(event,'${safe(pid)}','${safe(sid)}')"><label>Nombre</label><input name="name" required maxlength="110" value="${safe(s.name)}" placeholder="Ej. Museo del Prado"><label>Tipo</label><select name="kind">${['Ciudad','Visita','Comida','Transporte','Excursión','Hotel','Otro'].map(k=>`<option ${s.kind===k?'selected':''}>${k}</option>`).join('')}</select><div class="formCols"><div><label>Día</label><input name="day" type="date" value="${safe(s.day)}"></div><div><label>Hora</label><input name="time" type="time" value="${safe(s.time)}"></div></div><label>Dirección o localidad para buscar en el mapa</label><input name="address" id="stopAddress" maxlength="180" value="${safe(s.address||s.name)}" placeholder="Ej. Museo del Prado, Madrid"><button class="secondary" type="button" style="margin-top:8px" onclick="geocodeCurrentStop()">🔎 Buscar ubicación en mapa</button><div id="geoResult" class="sub" style="margin:9px 0">${s.lat!=null?`📍 Coordenadas guardadas: ${Number(s.lat).toFixed(4)}, ${Number(s.lng).toFixed(4)}`:'Sin ubicación todavía. Puedes guardar sin mapa.'}</div><input type="hidden" name="lat" id="stopLat" value="${s.lat??''}"><input type="hidden" name="lng" id="stopLng" value="${s.lng??''}"><label>Notas</label><textarea name="note" maxlength="1500">${safe(s.note||'')}</textarea><div class="modalActions"><button class="outline" type="button" onclick="closeModal()">Cancelar</button><button class="primary">Guardar parada</button></div></form>`)}

function saveStop(e,pid,sid){e.preventDefault();let f=new FormData(e.target),d=tripData(pid),o={name:String(f.get('name')).trim(),kind:String(f.get('kind')),day:String(f.get('day')||''),time:String(f.get('time')||''),address:String(f.get('address')||''),note:String(f.get('note')||''),lat:f.get('lat')===''?null:Number(f.get('lat')),lng:f.get('lng')===''?null:Number(f.get('lng'))};if(!o.name)return;let old=d.stops.find(x=>x.id===sid);if(old)Object.assign(old,o);else d.stops.push({id:id(),...o});closeModal();render();toast('Parada guardada ✓')}

async function initTripMap(){if(tab!=='viajes'||!tripSelected)return;const holder=document.getElementById('tripMap');if(!holder)return;let data=tripData(tripSelected).stops.filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lng));if(!data.length){holder.innerHTML='<div class="mapFallback">🗺️ <b>Tu mapa empieza aquí</b><span>Añade una parada y pulsa «Buscar ubicación en mapa» para situarla.</span></div>';return}
 try{if(!window.L){if(!document.getElementById('leafletCSS')){let css=document.createElement('link');css.id='leafletCSS';css.rel='stylesheet';css.href='https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';document.head.append(css)}await new Promise((resolve,reject)=>{let script=document.createElement('script');script.src='https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';script.onload=resolve;script.onerror=reject;document.head.append(script)})}if(!holder.isConnected)return;if(mapObject){mapObject.remove();mapObject=null}holder.innerHTML='';mapObject=L.map(holder,{scrollWheelZoom:false});L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(mapObject);const coords=[];data.forEach((s,i)=>{let pos=[s.lat,s.lng];coords.push(pos);L.marker(pos).addTo(mapObject).bindPopup(`<b>${safe(s.name)}</b><br>${safe(s.day||'Sin día')}`)});if(coords.length>1)L.polyline(coords,{color:'#8457ec',weight:3,opacity:.65,dashArray:'6,7'}).addTo(mapObject);mapObject.fitBounds(L.latLngBounds(coords).pad(.24),{maxZoom:12});setTimeout(()=>mapObject?.invalidateSize(),150)}catch(e){holder.innerHTML='<div class="mapFallback">🌐 <b>Mapa no disponible</b><span>Comprueba tu conexión. Las paradas están guardadas y puedes abrirlas en OpenStreetMap.</span></div>'}}
async function drawTripRoute(){const stops=tripData(tripSelected).stops.filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lng));if(stops.length<2)return toast('Necesitas al menos dos paradas con ubicación');if(stops.length>50)return toast('Para calcular la ruta usa un máximo de 50 paradas');toast('Calculando ruta en carretera…');try{let q=stops.map(s=>s.lng+','+s.lat).join(';');let r=await fetch('https://router.project-osrm.org/route/v1/driving/'+q+'?overview=full&geometries=geojson');if(!r.ok)throw Error('Servicio no disponible');let j=await r.json();if(!j.routes?.length)throw Error('No hay ruta disponible');if(!mapObject){toast('Abre el mapa primero con conexión');return}if(routeLine)mapObject.removeLayer(routeLine);routeLine=L.geoJSON(j.routes[0].geometry,{style:{color:'#19a786',weight:5,opacity:.85}}).addTo(mapObject);mapObject.fitBounds(routeLine.getBounds().pad(.15));toast('Ruta trazada ✓ · Distancia aproximada '+(j.routes[0].distance/1000).toFixed(1)+' km')}catch(e){toast('No se pudo calcular la ruta. Puedes abrir las paradas en OpenStreetMap.')}}
function openExternalRoute(){const stops=tripData(tripSelected).stops.filter(s=>Number.isFinite(s.lat)&&Number.isFinite(s.lng));if(!stops.length)return toast('Añade ubicaciones al itinerario');let first=stops[0],last=stops[stops.length-1];let url=stops.length===1?`https://www.openstreetmap.org/?mlat=${first.lat}&mlon=${first.lng}#map=12/${first.lat}/${first.lng}`:`https://www.openstreetmap.org/directions?engine=fossgis_osrm_car&route=${first.lat}%2C${first.lng}%3B${last.lat}%2C${last.lng}`;window.open(url,'_blank','noopener,noreferrer');if(stops.length>2)toast('OpenStreetMap abre origen y destino; las paradas intermedias están en LifePlan.')}

<script>

<section class="chatBox ${chatOpen?'open':''}" aria-label="Chat de LifePlan" role="dialog" aria-modal="false">
<div class="chatHead"><strong>💬 Charlas en LifePlan</strong><button onclick="toggleChat(false)" aria-label="Cerrar">✕</button></div>
<div class="chatTools"><button onclick="chatCreateModal()">＋ Nueva sala</button><button onclick="chatJoinModal()">🔗 Unirme con código</button>${online?`<button onclick="chatInvite()">📨 Invitar</button><button onclick="chatLeave()">Salir</button>`:''}<button onclick="chatRefresh(true)">↻ Actualizar</button></div>
<div class="chatRooms">${chatList().map(x=>`<button class="${chatSelected===x.id?'sel':''}" onclick="chatSelect('${safe(x.id)}')">${chatEmoji[x.category]||'💬'} ${safe(x.name)}${x.online?' ☁️':''}</button>`).join('')}</div>
<div class="chatStatus">${online?'🔒 Sala online privada · Solo miembros': '🗂️ Conversación local · No compartida'}${chatLoading?' · Cargando…':''}${chatError?' · '+safe(chatError):''}</div>
<div class="chatMessages" id="chatMessageScroll" aria-live="polite">${msgs.length?msgs.map(m=>`<div class="chatMsg ${m.by==='Yo'||(online&&m.sender_id===user?.id)?'mine':''}"><small>${safe(online?(m.sender_id===user?.id?'Tú':(m.sender_id||'Participante').slice(0,8)):(m.by||'Yo'))} · ${chatFormatDate(m.date||m.created_at)}</small><p>${safe(m.text||m.body)}</p></div>`).join(''):`<div class="chatEmpty">Todavía no hay mensajes. Empieza la conversación ✨</div>`}</div>
<form class="chatEntry" onsubmit="chatSend(event)"><textarea name="message" rows="2" maxlength="1500" required placeholder="Escribe un mensaje…" aria-label="Nuevo mensaje"></textarea><button title="Enviar mensaje" ${online&&!user?'disabled':''}>➤</button></form>
</section>`;

}

if(mode==='online') {if(!user||!client)return toast('Conecta tu cuenta antes');try{const {data,error}=await client.rpc('chat_room_create',{p_name:name,p_category:category});if(error)throw error;closeModal();chatOpen=true;await chatLoadRooms(data);chatSelected=data;chatOnlineMessages=[];drawChat();toast('Sala online creada ✨')}catch(err){toast('No se pudo crear la sala: '+err.message)}return}

function weeklyPage(){
 const start=weekStart(calendarDate||TODAY()); const dates=Array.from({length:7},(_,i)=>addDays(start,i));
 const blocks=dates.map(d=>({date:d,tasks:dayTasks(d).sort((a,b)=>(a.time||'99').localeCompare(b.time||'99'))}));
 return header('Tu horario semanal 🕒','Una semana entera, de un vistazo. Pulsa una celda para añadir una actividad.')+`<div class="card"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><button class="outline" onclick="calendarDate=addDays('${start}',-7);renderMain()">← Semana anterior</button><b>${prettyDay(start)} — ${prettyDay(dates[6])}</b><button class="outline" onclick="calendarDate=addDays('${start}',7);renderMain()">Siguiente →</button></div><div class="row" style="margin-top:12px;gap:8px;flex-wrap:wrap"><button class="secondary" onclick="calendarDate=TODAY();renderMain()">Hoy</button><button class="outline" onclick="exportCalendar()">↓ Exportar calendario (.ics)</button><button class="outline" onclick="go('agenda')">Ver mes</button></div></div>`+
 `<div class="v5WeekScroll"><div class="v5WeekGrid"><div class="v5WeekHead">Hora</div>${dates.map(d=>`<div class="v5WeekHead ${d===TODAY()?'v5Current':''}">${prettyDay(d)}${state.specials[d]?`<small>⭐ ${safe(state.specials[d].type)}</small>`:''}</div>`).join('')}${Array.from({length:16},(_,hi)=>{const hour=hi+7;return `<div class="v5WeekHour">${String(hour).padStart(2,'0')}:00</div>${blocks.map(b=>{const list=b.tasks.filter(t=>t.time&&+t.time.slice(0,2)===hour);return `<div class="v5WeekCell" onclick="calendarDate='${b.date}';editTask()" title="Añadir actividad">${list.map(t=>`<button class="v5TimeBlock ${isDone(t,b.date)?'v5Done':''}" onclick="event.stopPropagation();editTask('${safe(t.id)}')" title="Editar ${safe(t.title)}"><strong>${safe(t.time)}</strong> ${safe(t.title)}</button>`).join('')}</div>`}).join('')}`}).join('')}</div></div>`+
 `<div class="sectionhead"><h2>📋 Actividades sin hora</h2></div><div class="card">${blocks.map(b=>{const arr=b.tasks.filter(t=>!t.time);return arr.length?`<div class="v5NoTime"><b>${prettyDay(b.date)}</b>${arr.map(t=>enhancedTaskRow(t,b.date)).join('')}</div>`:''}).join('')||'<div class="empty">Sin actividades sin hora.</div>'}</div><p class="mini">Nota: el horario representa las horas de inicio. La duración se indica en cada tarea; no se bloquean automáticamente las celdas siguientes.</p>`
}
// Notas con carpeta, buscador y opciones de fijar.
function notesPage(){const q=(state.noteSearch||'').toLowerCase(),folder=state.noteFilter||'all';let list=state.notes.filter(n=>(folder==='all'||(n.folderId||'')===folder)&&(!q||`${n.title} ${n.body}`.toLowerCase().includes(q))).sort((a,b)=>Number(!!b.pinned)-Number(!!a.pinned)||(b.updated||'').localeCompare(a.updated||''));return header('Tus notas 📝','Ideas, listas, apuntes y referencias, siempre a mano.')+`<div class="card"><div class="row" style="flex-wrap:wrap"><input style="flex:1;min-width:180px" placeholder="Buscar en notas…" value="${safe(state.noteSearch||'')}" oninput="updateNoteSearch(this)"><select style="width:auto;max-width:200px" onchange="state.noteFilter=this.value;renderMain()"><option value="all">Todas las carpetas</option><option value="" ${folder===''?'selected':''}>Sin carpeta</option>${(state.folders||[]).map(f=>`<option value="${safe(f.id)}" ${folder===f.id?'selected':''}>${safe(f.name)}</option>`).join('')}</select><button class="primary" onclick="editNote()">＋ Nota</button></div></div><div class="v5NoteGrid">${list.map(n=>`<div class="v5Note card"><div class="row" style="justify-content:space-between"><span>${n.pinned?'📌':'📝'} ${safe(folderName(n.folderId))}</span><button class="link" onclick="pinNote('${safe(n.id)}')">${n.pinned?'Desfijar':'Fijar'}</button></div><h3>${safe(n.title)}</h3><p>${safe(n.body||'').slice(0,240)}</p><div class="row" style="justify-content:space-between"><span class="mini">${n.updated?safe(n.updated.slice(0,10)):''}</span><span><button class="link" onclick="editNote('${safe(n.id)}')">Editar</button> <button class="link" onclick="deleteNote('${safe(n.id)}')">Borrar</button></span></div></div>`).join('')||'<div class="card empty">Todavía no hay notas en esta sección. Crea tu primera idea.</div>'}</div>`}
function updateNoteSearch(el){const pos=el.selectionStart;state.noteSearch=el.value;renderMain();let target=document.querySelector('input[placeholder="Buscar en notas…"]');if(target){target.focus();try{target.setSelectionRange(pos,pos)}catch{}}}
function editNote(nid=''){const n=state.notes.find(x=>x.id===nid)||{title:'',body:'',folderId:'',pinned:false};modal(`<h2>${nid?'Editar nota':'📝 Nueva nota'}</h2><form onsubmit="saveNote(event,'${safe(nid)}')"><label>Título</label><input name="title" required maxlength="120" value="${safe(n.title)}" placeholder="Mi idea..."><label>Carpeta</label><select name="folderId"><option value="">Sin carpeta</option>${(state.folders||[]).map(f=>`<option value="${safe(f.id)}" ${n.folderId===f.id?'selected':''}>${safe(f.name)}</option>`).join('')}</select><label>Contenido</label><textarea name="body" rows="10" maxlength="30000" placeholder="Apuntes, ideas, enlaces...">${safe(n.body)}</textarea><div class="modalActions"><button type="button" class="outline" onclick="closeModal()">Cancelar</button><button class="primary">Guardar nota</button></div></form>`)}
function saveNote(e,nid){e.preventDefault();const f=new FormData(e.target),o={title:String(f.get('title')||'').trim(),body:String(f.get('body')||''),folderId:String(f.get('folderId')||''),updated:new Date().toISOString()};if(!o.title)return;let n=state.notes.find(x=>x.id===nid);if(n)Object.assign(n,o);else state.notes.push({id:id(),pinned:false,...o});closeModal();render();toast('Nota guardada ✓')}
function pinNote(nid){let n=state.notes.find(x=>x.id===nid);if(n){n.pinned=!n.pinned;render()}}
function deleteNote(nid){if(!confirm('¿Borrar esta nota?'))return;state.notes=state.notes.filter(x=>x.id!==nid);render()}
// Reservas detalladas: transporte, alojamiento reservado, entradas y actividades.
function tripBookings(pid){const d=tripData(pid);d.bookings ||= [];return d.bookings}
const bookingKinds=['🚆 Tren','✈️ Vuelo','🚌 Autobús','🚗 Coche','🎫 Entrada','🍽️ Restaurante','🛏️ Otro'];
function bookingsSection(pid){const bookings=tripBookings(pid);return `<div class="sectionhead"><h2>🎟️ Reservas y transportes (${bookings.length})</h2><button class="secondary" onclick="editBooking('${safe(pid)}')">＋ Reserva</button></div><div class="card">${bookings.length?bookings.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(b=>`<div class="v5Booking"><span style="font-size:23px">${safe(b.kind.split(' ')[0])}</span><div class="grow"><b>${safe(b.name)}</b><div class="mini">${safe(b.date||'Sin fecha')} ${safe(b.time||'')} · ${safe(b.place||'Sin ubicación')}</div>${b.reference?`<div class="mini">Referencia: ${safe(b.reference)}</div>`:''}${b.notes?`<div class="mini">${safe(b.notes)}</div>`:''}</div><div><button class="link" onclick="editBooking('${safe(pid)}','${safe(b.id)}')">Editar</button>${b.url?`<a class="link" target="_blank" rel="noopener noreferrer" href="${safe(externalUrl(b.url))}">Abrir</a>`:''}<button class="link" onclick="removeBooking('${safe(pid)}','${safe(b.id)}')">✕</button></div></div>`).join(''):'<div class="empty">Guarda vuelos, trenes, entradas y reservas en un solo lugar.</div>'}<p class="mini">No guardes contraseñas, pasaportes ni números de tarjetas aquí.</p></div>`}
function editBooking(pid,bid=''){let b=tripBookings(pid).find(x=>x.id===bid)||{kind:'✈️ Vuelo',name:'',date:'',time:'',place:'',reference:'',url:'',notes:''};modal(`<h2>🎟️ ${bid?'Editar reserva':'Añadir reserva'}</h2><form onsubmit="saveBooking(event,'${safe(pid)}','${safe(bid)}')"><label>Tipo</label><select name="kind">${bookingKinds.map(k=>`<option ${k===b.kind?'selected':''}>${k}</option>`).join('')}</select><label>Nombre / compañía</label><input name="name" required maxlength="120" value="${safe(b.name)}" placeholder="Renfe, Iberia, Museo..." ><div class="formCols"><div><label>Fecha</label><input name="date" type="date" value="${safe(b.date)}"></div><div><label>Hora</label><input name="time" type="time" value="${safe(b.time)}"></div></div><label>Lugar / origen y destino</label><input name="place" maxlength="200" value="${safe(b.place)}"><label>Referencia breve (opcional)</label><input name="reference" maxlength="100" value="${safe(b.reference)}"><label>Enlace de reserva</label><input name="url" type="url" value="${safe(b.url)}" placeholder="https://"><label>Notas</label><textarea name="notes" maxlength="2000">${safe(b.notes)}</textarea><div class="modalActions"><button class="outline" type="button" onclick="closeModal()">Cancelar</button><button class="primary">Guardar</button></div></form>`)}
function saveBooking(e,pid,bid){e.preventDefault();const f=new FormData(e.target),o={kind:String(f.get('kind')),name:String(f.get('name')).trim(),date:String(f.get('date')),time:String(f.get('time')),place:String(f.get('place')),reference:String(f.get('reference')),url:externalUrl(String(f.get('url')||'')),notes:String(f.get('notes')||'')};if(o.url==='#')o.url='';const a=tripBookings(pid),old=a.find(x=>x.id===bid);if(old)Object.assign(old,o);else a.push({id:id(),...o});closeModal();render();toast('Reserva guardada ✓')}
function removeBooking(pid,bid){if(!confirm('¿Eliminar la reserva?'))return;let d=tripData(pid);d.bookings=tripBookings(pid).filter(x=>x.id!==bid);render()}
const originalTripDetailsV5=tripDetailsPage;
tripDetailsPage=function(p){let core=originalTripDetailsV5(p);return core+bookingsSection(p.id)+`<div class="card" style="margin-top:16px"><div class="row" style="justify-content:space-between;flex-wrap:wrap"><div><b>📅 Lleva este viaje a tu calendario</b><p class="sub">Exporta el itinerario y las reservas a otras agendas.</p></div><button class="secondary" onclick="exportCalendar('${safe(p.id)}')">↓ Exportar viaje (.ics)</button></div></div>`};
// Exportación iCalendar: las tareas recurrentes usan RRULE en vez de multiplicar eventos.
function icsEscape(s){return String(s??'').replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;')}
function icsDate(d){return String(d).replace(/-/g,'')}
function icsEvent(o){let date=o.date||TODAY();let time=o.time||'';let dt=time?`DTSTART:${icsDate(date)}T${time.replace(':','')}00`: `DTSTART;VALUE=DATE:${icsDate(date)}`;let lines=['BEGIN:VEVENT','UID:'+icsEscape(o.uid||id())+'@lifeplan.local','DTSTAMP:'+new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'').replace('Z','Z'),dt,'SUMMARY:'+icsEscape(o.title||'Actividad')];if(!time)lines.push(`DTEND;VALUE=DATE:${icsDate(addDays(date,1))}`);else{let ds=new Date(date+'T'+time+':00');ds.setMinutes(ds.getMinutes()+(Number(o.duration)||30));lines.push('DTEND:'+ds.getFullYear()+String(ds.getMonth()+1).padStart(2,'0')+String(ds.getDate()).padStart(2,'0')+'T'+String(ds.getHours()).padStart(2,'0')+String(ds.getMinutes()).padStart(2,'0')+'00')};if(o.description)lines.push('DESCRIPTION:'+icsEscape(o.description));const rule={'diaria':'FREQ=DAILY','laborables':'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR','semanal':'FREQ=WEEKLY','mensual':'FREQ=MONTHLY','anual':'FREQ=YEARLY'}[o.repeat];if(rule)lines.push('RRULE:'+rule);lines.push('END:VEVENT');return lines.join('\r\n')}
function exportCalendar(pid=''){let events=[];if(pid){let p=state.plans.find(x=>x.id===pid);if(!p)return;let d=tripData(pid);events=(d.stops||[]).filter(x=>x.day).map(x=>({date:x.day,time:x.time,uid:x.id,title:x.name,description:x.address+' '+x.note}));events.push(...(d.bookings||[]).filter(x=>x.date).map(x=>({date:x.date,time:x.time,uid:x.id,title:x.kind+' · '+x.name,description:x.place+' '+x.notes})));events.push(...(d.stays||[]).filter(x=>x.checkin).map(x=>({date:x.checkin,uid:x.id,title:'Check-in · '+x.name,description:x.address})));}else events=state.tasks.map(t=>({uid:t.id,date:t.date,time:t.time,title:t.title,description:t.description,repeat:t.repeat,duration:t.duration}));if(!events.length){toast('No hay eventos para exportar');return}const ical=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LifePlan//Personal Planner//ES','CALSCALE:GREGORIAN',...events.map(icsEvent),'END:VCALENDAR'].join('\r\n');let blob=new Blob([ical],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=pid?'lifeplan-viaje.ics':'lifeplan-agenda.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Calendario exportado ✓')}
// Incluir apuntes en la navegación global y mejoras del perfil.
const prevProfileV5=profile;
profile=function(){return prevProfileV5()+`<div class="card" style="margin-top:20px"><h3>💾 Tu información, bajo tu control</h3><p class="sub">Descarga una copia JSON periódicamente. Este navegador conserva tus datos locales, pero al limpiar su almacenamiento podrían perderse. Las notas también se incluyen en la copia.</p><div class="row" style="gap:10px;flex-wrap:wrap"><button class="primary" onclick="exportData()">↓ Copia de seguridad</button><button class="outline" onclick="importData()">↑ Restaurar copia</button><button class="outline" onclick="exportCalendar()">↓ Agenda .ics</button></div></div>`};
// El buscador de la app pasa a incluir las notas.
const prevSearchResultsV5=searchResultsHtml;
searchResultsHtml=function(items){let x=prevSearchResultsV5(items);let q=String(globalQuery||'').trim().toLowerCase();let notes=state.notes.filter(n=>`${n.title} ${n.body}`.toLowerCase().includes(q)).slice(0,10);return x+(notes.length?`<div class="sectionhead"><h2>📝 Notas (${notes.length})</h2></div><div class="card">${notes.map(n=>`<div class="v5TaskRow"><div class="grow"><b>${safe(n.title)}</b></div><button class="link" onclick="editNote('${safe(n.id)}')">Abrir</button></div>`).join('')}</div>`:'')};
// Mostrar en la parte superior un atajo universal con teclado.
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();go('buscar');const el=document.querySelector('input[placeholder*="Buscar"]');if(el)el.focus()}if(e.key==='Escape')closeModal()});
render();

</script></body></html>
