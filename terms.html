<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7650e9"><link rel="icon" href="./lifeplan-icon-64.png"><title>LifePlan</title><style>
:root{color-scheme:light;--purple:#7650e9;--ink:#27213b;--muted:#6d687a}
*{box-sizing:border-box}body{margin:0;background:#f7f6fc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);line-height:1.7}
main{max-width:800px;margin:35px auto 85px;background:white;border:1px solid #ece8f7;border-radius:24px;padding:clamp(24px,5vw,48px);box-shadow:0 14px 52px #4a31820a}
a{color:#6342cf}a:hover{text-decoration-thickness:2px}h1{font-size:clamp(28px,5vw,40px);line-height:1.2;margin:12px 0 18px}h2{font-size:20px;margin:30px 0 5px}p,li{font-size:15px}ul{padding-left:21px}.top{max-width:800px;margin:28px auto 0;padding:0 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:19px;font-weight:850;display:flex;align-items:center;gap:9px;text-decoration:none;color:#302345}.brand img{width:37px;height:37px;border-radius:12px}.back{font-weight:700;text-decoration:none}
.meta{font-size:13px;color:var(--muted)}.note{background:#f4efff;border:1px solid #e8dfff;border-radius:13px;padding:14px 16px}.note.warning{background:#fffaf0;border-color:#f1dfb4}.foot{display:flex;flex-wrap:wrap;gap:15px;border-top:1px solid #eee8f8;padding-top:18px;margin-top:35px;font-size:13px}.lang{font:inherit;border:1px solid #d5c9ea;border-radius:10px;padding:8px 9px;background:#fff;color:var(--ink)}
@media(max-width:580px){main{border-radius:0;margin:14px 0 40px;border-left:0;border-right:0}.top{margin-top:18px}}
</style></head><body><header class="top"><a class="brand" href="./"><img src="./lifeplan-icon-64.png" width="37" height="37" alt=""> LifePlan</a><select class="lang" id="lang" aria-label="Language"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option></select></header><main><h1 id="title"></h1><p class="meta" id="updated"></p><div id="sections"></div><nav class="foot" id="footer" aria-label="Related pages"></nav></main><script>
const CONTENT = {"page":"terms","translations":{"en":["Terms of use",[["The service","LifePlan helps you manage tasks, projects and plans. Features can change while the service is being tested."],["Your account","You are responsible for keeping access to your account secure. Do not share credentials or attempt to access other accounts."],["Your content","You retain responsibility for content you create or publish. Do not upload unlawful material, threats, harassment or other users’ private information."],["Social features","Respect other users. Blocking and reporting are available where configured; reports may require manual review."],["Availability","The service may occasionally be unavailable. Keep your own copy of important information."],["Account termination","You may request deletion of your account and associated data. See the account-deletion page."],["Operator and updates","For questions about the service or these terms, email norasobrinodorca@gmail.com. The operator’s full legal identity and address must still be completed before public release. These terms may be updated."]]],"es":["Condiciones de uso",[["El servicio","LifePlan permite gestionar tareas, proyectos y planes. Algunas funciones pueden cambiar durante las pruebas."],["Tu cuenta","Eres responsable de proteger el acceso a tu cuenta. No compartas contraseñas ni intentes acceder a cuentas ajenas."],["Tu contenido","Eres responsable del contenido que creas o publicas. No publiques material ilícito, amenazas, acoso ni datos privados de otras personas."],["Funciones sociales","Respeta a los demás usuarios. El bloqueo y las denuncias están disponibles cuando están configurados; las denuncias pueden requerir revisión manual."],["Disponibilidad","El servicio puede sufrir interrupciones. Conserva una copia propia de la información importante."],["Eliminación de cuenta","Puedes solicitar la eliminación de tu cuenta y de los datos asociados. Consulta la página de eliminación de cuenta."],["Responsable y cambios","Para consultas sobre el servicio o estas condiciones, escribe a norasobrinodorca@gmail.com. Antes del lanzamiento público debe completarse la identidad legal y la dirección del responsable. Estas condiciones pueden actualizarse."]]],"fr":["Conditions d’utilisation",[["Le service","LifePlan sert à gérer tâches, projets et voyages. Certaines fonctionnalités peuvent évoluer pendant les tests."],["Votre compte","Vous devez protéger l’accès à votre compte et respecter les comptes des autres utilisateurs."],["Votre contenu","Vous êtes responsable de vos contenus. Les messages illégaux, le harcèlement et la divulgation de données privées sont interdits."],["Fonctions sociales","Respectez les autres utilisateurs. Les signalements peuvent nécessiter une vérification manuelle."],["Disponibilité","Des interruptions sont possibles. Conservez une copie des informations importantes."],["Suppression","Vous pouvez demander la suppression de votre compte et des données associées."],["Responsable","Pour toute question concernant le service ou ces conditions, écrivez à norasobrinodorca@gmail.com. L’identité juridique complète et l’adresse du responsable doivent encore être précisées avant le lancement public."]]],"pt":["Termos de utilização",[["O serviço","A LifePlan ajuda a organizar tarefas, projetos e viagens. Algumas funcionalidades podem mudar durante os testes."],["A tua conta","Protege o acesso à tua conta e respeita as contas de outros utilizadores."],["O teu conteúdo","És responsável pelos conteúdos que publicas. Não são permitidos conteúdos ilegais, assédio ou divulgação de dados privados."],["Funcionalidades sociais","Respeita outros utilizadores. As denúncias podem exigir análise manual."],["Disponibilidade","O serviço pode ter interrupções. Guarda uma cópia das informações importantes."],["Eliminação","Podes solicitar a eliminação da conta e dos dados associados."],["Responsável","Para questões sobre o serviço ou estas condições, escreve para norasobrinodorca@gmail.com. A identidade legal completa e a morada do responsável ainda devem ser indicadas antes do lançamento público."]]]},"links":[["privacy","Privacy","Privacidad","Confidentialité","Privacidade"],["terms","Terms","Condiciones","Conditions","Condições"],["delete-account","Delete account","Eliminar cuenta","Supprimer le compte","Eliminar conta"],["support","Support","Soporte","Assistance","Suporte"]]};
function show(lang){
 const v=CONTENT.translations[lang]||CONTENT.translations.en;
 document.documentElement.lang=lang;document.title=v[0]+' — LifePlan';
 document.getElementById('title').textContent=v[0];
 document.getElementById('updated').textContent=({en:'Updated 11 November 2026 · Draft: verify before public launch',es:'Actualizado el 11 de noviembre de 2026 · Borrador: revisar antes del lanzamiento',fr:'Mis à jour le 11 novembre 2026 · Projet à valider avant le lancement',pt:'Atualizado a 11 de novembro de 2026 · Rascunho a validar antes do lançamento'})[lang];
 const sections=document.getElementById('sections');sections.replaceChildren();
 v[1].forEach(([heading,body])=>{const h=document.createElement('h2');h.textContent=heading;const p=document.createElement('p');p.textContent=body;sections.append(h,p)});
 const footer=document.getElementById('footer');footer.replaceChildren();
 CONTENT.links.forEach(item=>{const a=document.createElement('a');a.href='./'+item[0]+'.html';a.textContent=item[['en','es','fr','pt'].indexOf(lang)+1];footer.append(a)});
 const a=document.createElement('a');a.href='./';a.textContent=({en:'Back to LifePlan',es:'Volver a LifePlan',fr:'Retour à LifePlan',pt:'Voltar à LifePlan'})[lang];footer.prepend(a);
 const contact=document.createElement('a');
 const subjects={en:"LifePlan \u2014 Support and privacy",es:"LifePlan \u2014 Soporte y privacidad",fr:"LifePlan \u2014 Assistance et confidentialit\u00e9",pt:"LifePlan \u2014 Apoio e privacidade"};
 contact.href='mailto:norasobrinodorca@gmail.com?subject='+encodeURIComponent(subjects[lang]);
 contact.textContent=({"en": "Contact LifePlan", "es": "Contactar con LifePlan", "fr": "Contacter LifePlan", "pt": "Contactar a LifePlan"} )[lang];
 footer.append(contact);

}
let lang='en';try{lang=localStorage.getItem('lifeplan-ui-language')||'en'}catch(_){}
if(!['en','es','fr','pt'].includes(lang))lang='en';
document.getElementById('lang').value=lang;show(lang);
document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;try{localStorage.setItem('lifeplan-ui-language',lang)}catch(_){}show(lang)});
</script></body></html>
