<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7650e9"><link rel="icon" href="./lifeplan-icon-64.png"><title>LifePlan</title><style>
:root{color-scheme:light;--purple:#7650e9;--ink:#27213b;--muted:#6d687a}
*{box-sizing:border-box}body{margin:0;background:#f7f6fc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);line-height:1.7}
main{max-width:800px;margin:35px auto 85px;background:white;border:1px solid #ece8f7;border-radius:24px;padding:clamp(24px,5vw,48px);box-shadow:0 14px 52px #4a31820a}
a{color:#6342cf}a:hover{text-decoration-thickness:2px}h1{font-size:clamp(28px,5vw,40px);line-height:1.2;margin:12px 0 18px}h2{font-size:20px;margin:30px 0 5px}p,li{font-size:15px}ul{padding-left:21px}.top{max-width:800px;margin:28px auto 0;padding:0 15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.brand{font-size:19px;font-weight:850;display:flex;align-items:center;gap:9px;text-decoration:none;color:#302345}.brand img{width:37px;height:37px;border-radius:12px}.back{font-weight:700;text-decoration:none}
.meta{font-size:13px;color:var(--muted)}.note{background:#f4efff;border:1px solid #e8dfff;border-radius:13px;padding:14px 16px}.note.warning{background:#fffaf0;border-color:#f1dfb4}.foot{display:flex;flex-wrap:wrap;gap:15px;border-top:1px solid #eee8f8;padding-top:18px;margin-top:35px;font-size:13px}.lang{font:inherit;border:1px solid #d5c9ea;border-radius:10px;padding:8px 9px;background:#fff;color:var(--ink)}
@media(max-width:580px){main{border-radius:0;margin:14px 0 40px;border-left:0;border-right:0}.top{margin-top:18px}}
</style></head><body><header class="top"><a class="brand" href="./"><img src="./lifeplan-icon-64.png" width="37" height="37" alt=""> LifePlan</a><select class="lang" id="lang" aria-label="Language"><option value="en">English</option><option value="es">Español</option><option value="fr">Français</option><option value="pt">Português</option></select></header><main><h1 id="title"></h1><p class="meta" id="updated"></p><div id="sections"></div><nav class="foot" id="footer" aria-label="Related pages"></nav></main><script>
const CONTENT = {"page":"delete-account","translations":{"en":["Delete your LifePlan account",[["Delete from the website","Sign in on the LifePlan website, open Profile → Account and select Delete account. Confirm the request. This requires the server-side deletion function to be deployed and working."],["If you cannot sign in","If you cannot access your account, send a deletion request to norasobrinodorca@gmail.com from the email address associated with your LifePlan account. Include that you want to delete your LifePlan account. Identity must be verified before any deletion; sending an email does not immediately delete the account."],["What is deleted","The intention is to remove the authentication account and associated records. Deletion of storage files, operational logs and backups needs to be confirmed before release."],["Before deleting","Deletion cannot be reversed. Export a copy of any data you need before deleting the account."]]],"es":["Eliminar tu cuenta de LifePlan",[["Desde la web","Inicia sesión en LifePlan, abre Perfil → Cuenta y pulsa Eliminar cuenta. Confirma la solicitud. Para funcionar es necesario que la función de eliminación del servidor esté desplegada."],["Si no puedes entrar","Si no puedes acceder a tu cuenta, envía una solicitud de eliminación a norasobrinodorca@gmail.com desde el correo asociado a tu cuenta de LifePlan. Indica que quieres eliminar tu cuenta. Habrá que verificar tu identidad antes de borrar nada; enviar el correo no elimina la cuenta automáticamente."],["Qué se elimina","Está previsto eliminar la cuenta de autenticación y sus registros asociados. Hay que confirmar el borrado de archivos, registros técnicos y copias de seguridad antes del lanzamiento."],["Antes de borrar","La eliminación no se puede deshacer. Exporta una copia de los datos que necesites."]]],"fr":["Supprimer votre compte LifePlan",[["Depuis le site","Connectez-vous à LifePlan, ouvrez Profil → Compte puis Supprimer le compte. Une fonction de suppression côté serveur doit être déployée."],["Sans accès au compte","Si vous ne pouvez plus accéder à votre compte, envoyez une demande de suppression à norasobrinodorca@gmail.com depuis l’adresse associée à votre compte LifePlan. Précisez que vous demandez la suppression du compte. Votre identité devra être vérifiée avant toute suppression ; l’envoi du message ne supprime pas immédiatement le compte."],["Données supprimées","L’objectif est de supprimer le compte et ses données associées. Les fichiers et sauvegardes doivent encore être vérifiés."],["Avant la suppression","La suppression est irréversible. Exportez vos données avant de continuer."]]],"pt":["Eliminar a tua conta LifePlan",[["A partir do site","Inicia sessão na LifePlan, abre Perfil → Conta e escolhe Eliminar conta. A função de eliminação do servidor tem de estar ativa."],["Se não conseguires entrar","Se não conseguires aceder à tua conta, envia um pedido de eliminação para norasobrinodorca@gmail.com a partir do endereço associado à tua conta LifePlan. Indica que pretendes eliminar a conta. Será necessário verificar a tua identidade; o envio do email não elimina a conta automaticamente."],["Dados eliminados","Pretende-se eliminar a conta e os dados associados. É necessário confirmar a eliminação de ficheiros e cópias de segurança."],["Antes de eliminar","A eliminação é irreversível. Exporta os dados que queiras guardar."]]]},"links":[["privacy","Privacy","Privacidad","Confidentialité","Privacidade"],["terms","Terms","Condiciones","Conditions","Condições"],["delete-account","Delete account","Eliminar cuenta","Supprimer le compte","Eliminar conta"],["support","Support","Soporte","Assistance","Suporte"]]};
function show(lang){
 const v=CONTENT.translations[lang]||CONTENT.translations.en;
 document.documentElement.lang=lang;document.title=v[0]+' — LifePlan';
 document.getElementById('title').textContent=v[0];
 document.getElementById('updated').textContent=({en:'Updated 11 November 2026 · Draft: verify before public launch',es:'Actualizado el 11 de noviembre de 2026 · Borrador: revisar antes del lanzamiento',fr:'Mis à jour le 11 novembre 2026 · Projet à valider avant le lancement',pt:'Atualizado a 11 de novembro de 2026 · Rascunho a validar antes do lançamento'})[lang];
 const sections=document.getElementById('sections');sections.replaceChildren();
 v[1].forEach(([heading,body])=>{const h=document.createElement('h2');h.textContent=heading;const p=document.createElement('p');p.textContent=body;sections.append(h,p)});
 const footer=document.getElementById('footer');footer.replaceChildren();
 CONTENT.links.forEach(item=>{const a=document.createElement('a');a.href='./'+item[0]+'.html';a.textContent=item[['en','es','fr','pt'].indexOf(lang)+1];footer.append(a)});
 const a=document.createElement('a');a.href='./';a.textContent=({en:'Back to LifePlan',es:'Volver a LifePlan',fr:'Retour à LifePlan',pt:'Voltar à LifePlan'})[lang];footer.prepend(a);
 const contact=document.createElement('a');
 const subjects={en:"LifePlan \u2014 Account deletion request",es:"LifePlan \u2014 Solicitud de eliminaci\u00f3n de cuenta",fr:"LifePlan \u2014 Demande de suppression de compte",pt:"LifePlan \u2014 Pedido de elimina\u00e7\u00e3o da conta"};
 contact.href='mailto:norasobrinodorca@gmail.com?subject='+encodeURIComponent(subjects[lang]);
 contact.textContent=({"en": "Email account deletion request", "es": "Solicitar eliminación por correo", "fr": "Demander la suppression par e-mail", "pt": "Pedir eliminação por email"} )[lang];
 footer.append(contact);

}
let lang='en';try{lang=localStorage.getItem('lifeplan-ui-language')||'en'}catch(_){}
if(!['en','es','fr','pt'].includes(lang))lang='en';
document.getElementById('lang').value=lang;show(lang);
document.getElementById('lang').addEventListener('change',e=>{lang=e.target.value;try{localStorage.setItem('lifeplan-ui-language',lang)}catch(_){}show(lang)});
</script></body></html>
